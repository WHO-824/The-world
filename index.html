                    }

                    alpha = mix(alpha, max(alpha, 0.28), vScatter);
                    alpha += vMouseGlow * 0.55;
                    alpha *= softDot * uIntroAlpha;

                    vec3 color = vec3(0.92, 0.94, 0.98) + vec3(0.1) * vMouseGlow;

                    gl_FragColor = vec4(color, clamp(alpha, 0.0, 0.95));
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const coreShellPoints = new THREE.Points(coreShellGeo, coreShellMat);
        masterGroup.add(coreShellPoints);

        // 4. 외부 부유 노드맵(Outer Node Map)
        const OUTER_COUNT = 46;
        const outerNodes = [];
        const outerPositions = new Float32Array(OUTER_COUNT * 3);
        const outerSizes = new Float32Array(OUTER_COUNT);
        const outerEnergies = new Float32Array(OUTER_COUNT);

        for (let i = 0; i < OUTER_COUNT; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const radius = 1.52 + Math.random() * 1.22;

            outerNodes.push({
                baseTheta: theta,
                basePhi: phi,
                baseRadius: radius,
                speedTheta: (Math.random() - 0.5) * 0.65,
                speedPhi: (Math.random() - 0.5) * 0.5,
                radialFreq: 0.4 + Math.random() * 0.9,
                radialAmp: 0.15 + Math.random() * 0.35,
                phase: Math.random() * Math.PI * 2,
                pos: new THREE.Vector3(),
                energy: 0
            });
            outerSizes[i] = 2.6 + Math.random() * 4.0;
        }

        const outerGeo = new THREE.BufferGeometry();
        outerGeo.setAttribute('position', new THREE.BufferAttribute(outerPositions, 3).setUsage(THREE.DynamicDrawUsage));
        outerGeo.setAttribute('aSize', new THREE.BufferAttribute(outerSizes, 1));
        outerGeo.setAttribute('aEnergy', new THREE.BufferAttribute(outerEnergies, 1).setUsage(THREE.DynamicDrawUsage));

        const outerMat = new THREE.ShaderMaterial({
            uniforms: {
                uOpacity: { value: 0.0 }
            },
            vertexShader: `
                attribute float aSize;
                attribute float aEnergy;
                varying float vAlpha;
                varying float vEnergy;
                void main() {
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    gl_PointSize = aSize * (1.0 + aEnergy * 1.25) * (6.5 / -mvPosition.z);
                    vAlpha = smoothstep(4.6, 1.05, length(position));
                    vEnergy = aEnergy;
                }
            `,
            fragmentShader: `
                uniform float uOpacity;
                varying float vAlpha;
                varying float vEnergy;
                void main() {
                    float dist = length(gl_PointCoord - vec2(0.5));
                    if (dist > 0.5) discard;
                    float glow = pow(1.0 - dist * 2.0, 1.8);
                    gl_FragColor = vec4(vec3(0.95, 0.97, 1.0), glow * vAlpha * (0.7 + vEnergy * 0.55) * uOpacity);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const outerPoints = new THREE.Points(outerGeo, outerMat);
        masterGroup.add(outerPoints);

        const MAX_LINES = OUTER_COUNT * OUTER_COUNT + OUTER_COUNT * 8;
        const linePositions = new Float32Array(MAX_LINES * 6);
        const lineColors = new Float32Array(MAX_LINES * 6);

        const linesGeo = new THREE.BufferGeometry();
        linesGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3).setUsage(THREE.DynamicDrawUsage));
        linesGeo.setAttribute('color', new THREE.BufferAttribute(lineColors, 3).setUsage(THREE.DynamicDrawUsage));

        const linesMat = new THREE.LineBasicMaterial({
            vertexColors: true,
            transparent: true,
            opacity: 0.0,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const nodeLines = new THREE.LineSegments(linesGeo, linesMat);
        masterGroup.add(nodeLines);

        // 4-2. 다레카 시퀀스용 복제 오브 그리드
        const darekaGroup = new THREE.Group();
        let darekaClones = [];

        function buildDarekaGrid() {
            while (darekaGroup.children.length > 0) {
                darekaGroup.remove(darekaGroup.children[0]);
            }
            darekaClones = [];

            const vFov = THREE.MathUtils.degToRad(camera.fov);
            const visHeight = 2 * Math.tan(vFov / 2) * CAMERA_DEFAULT_Z;
            const visWidth = visHeight * camera.aspect;

            const colSpacing = 1.55;
            const rowSpacing = 1.48;

            let cols = Math.max(5, Math.ceil(visWidth / colSpacing));
            if (cols % 2 === 0) cols += 1;
            cols += 4;

            let rows = Math.max(3, Math.ceil(visHeight / rowSpacing));
            if (rows % 2 === 0) rows += 1;
            rows += 4;

            const halfC = (cols - 1) / 2;
            const halfR = (rows - 1) / 2;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (c === halfC && r === halfR) continue;

                    const gx = (c - halfC) * colSpacing;
                    const gy = (r - halfR) * rowSpacing + ORB_CENTER_Y;

                    const startX = gx * 3.8;
                    const startY = ORB_CENTER_Y + (gy - ORB_CENTER_Y) * 3.8;

                    const cloneObj = new THREE.Group();
                    const shell = new THREE.Points(cloneShellGeo, coreShellMat);
                    cloneObj.add(shell);

                    orbitConfigs.forEach((cfg, idx) => {
                        const rGroup = new THREE.Group();
                        rGroup.rotation.copy(cfg.baseRot);
                        for (let s = 0; s < 3; s++) {
                            const line = new THREE.LineLoop(sharedRingGeos[idx], ringMaterial);
                            line.scale.setScalar(1 + (s - 1) * 0.007);
                            rGroup.add(line);
                        }
                        cloneObj.add(rGroup);
                    });

                    const cloneOuterPts = new THREE.Points(outerGeo, outerMat);
                    const cloneLines = new THREE.LineSegments(linesGeo, linesMat);
                    cloneObj.add(cloneOuterPts);
                    cloneObj.add(cloneLines);

                    cloneObj.quaternion.copy(masterGroup.quaternion);
                    cloneObj.position.set(startX, startY, 0);
                    cloneObj.scale.setScalar(0.85);
                    darekaGroup.add(cloneObj);

                    const insideViewX = Math.abs(gx) <= (visWidth * 0.36);
                    const insideViewY = Math.abs(gy - ORB_CENTER_Y) <= (visHeight * 0.32);

                    darekaClones.push({
                        group: cloneObj,
                        shell,
                        startPos: new THREE.Vector3(startX, startY, 0),
                        gridPos: new THREE.Vector3(gx, gy, 0),
                        canFocus: insideViewX && insideViewY
                    });
                }
            }
        }

        // 5. GOD 시퀀스용 6개의 흰 구
        const sixSpheresGroup = new THREE.Group();
        sixSpheresGroup.position.y = ORB_CENTER_Y;
        const sixSpheres = [];

        function createGlowTexture() {
            const size = 256;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
            grad.addColorStop(0.0, 'rgba(255, 255, 255, 0.95)');
            grad.addColorStop(0.28, 'rgba(245, 245, 245, 0.55)');
            grad.addColorStop(0.55, 'rgba(220, 220, 220, 0.15)');
            grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, size, size);
            return new THREE.CanvasTexture(canvas);
        }

        const glowTex = createGlowTexture();
        const whiteSphereGeo = new THREE.SphereGeometry(0.21, 48, 48);
        const whiteSphereMat = new THREE.ShaderMaterial({
            uniforms: {
                uOpacity: { value: 1.0 }
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vViewPos;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vec4 mv = modelViewMatrix * vec4(position, 1.0);
                    vViewPos = -mv.xyz;
                    gl_Position = projectionMatrix * mv;
                }
            `,
            fragmentShader: `
                uniform float uOpacity;
                varying vec3 vNormal;
                varying vec3 vViewPos;
                void main() {
                    float ndotv = clamp(dot(normalize(vNormal), normalize(vViewPos)), 0.0, 1.0);
                    float edgeSoft = smoothstep(0.0, 0.35, ndotv);
                    vec3 col = mix(vec3(0.85), vec3(0.98), ndotv);
                    gl_FragColor = vec4(col, edgeSoft * uOpacity);
                }
            `,
            transparent: true,
            depthWrite: false
        });

        for (let i = 0; i < 6; i++) {
            const container = new THREE.Group();
            const mesh = new THREE.Mesh(whiteSphereGeo, whiteSphereMat);
            const haloMat = new THREE.SpriteMaterial({
                map: glowTex,
                color: 0xffffff,
                transparent: true,
                opacity: 0.72,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const halo = new THREE.Sprite(haloMat);
            halo.scale.set(0.925, 0.925, 0.925);

            container.add(mesh);
            container.add(halo);
            sixSpheresGroup.add(container);

            const angle = (i / 6) * Math.PI * 2;
            sixSpheres.push({
                container,
                haloMat,
                startAngle: angle,
                startRadius: 9.5 + (i % 2) * 1.5,
                startZ: (i - 2.5) * 1.6,
                orbitTilt: (i % 3 - 1) * 0.55
            });
        }

        // 5-2. [역사 / HISTORY] 동적 가로 입자선 & 5개 밀집 원형 확장 시스템
        const HISTORY_NODE_NORM_X = [-0.82, -0.41, 0.0, 0.41, 0.82];
        const HIST_PARTICLE_COUNT = 6800;
        let historySpan = 4.0;
        let historyCircleScale = 1.0;
        let historyLineY = 0.58;

        const historyGroup = new THREE.Group();
        const historyNodeOpenCurrent = [0, 0, 0, 0, 0];
        const historyNodeWorldPositions = Array.from({ length: 5 }, () => new THREE.Vector3());
        let hoveredHistoryNode = -1;
        let selectedHistoryNode = -1;
        const visitedHistoryNodes = new Set();

        function evalHistoryWave(nx, t) {
            return Math.sin(nx * 4.2 - t * 1.15) * 0.052
                 + Math.sin(nx * 8.6 + t * 0.78) * 0.020
                 + Math.cos(nx * 2.1 - t * 0.55) * 0.032;
        }

        function updateHistoryLayout() {
            const vFov = THREE.MathUtils.degToRad(camera.fov);
            const visHeight = 2 * Math.tan(vFov / 2) * CAMERA_DEFAULT_Z;
            const visWidth = visHeight * camera.aspect;
            const isMobile = window.innerWidth <= 760;

            historySpan = Math.min(4.65, visWidth * (isMobile ? 0.43 : 0.40));
            historyCircleScale = Math.min(1.0, historySpan / 2.65);
            historyLineY = isMobile ? 0.85 : 0.58;

            historyGroup.position.y = historyLineY;
            historyLineMat.uniforms.uSpan.value = historySpan;
            historyLineMat.uniforms.uCircleScale.value = historyCircleScale;
        }

        function gaussianRandom() {
            let u = 0, v = 0;
            while (u === 0) u = Math.random();
            while (v === 0) v = Math.random();
            return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
        }

        const histPositions = new Float32Array(HIST_PARTICLE_COUNT * 3);
        const histBaseData = new Float32Array(HIST_PARTICLE_COUNT * 3); // x: normX, y: verticalOffset, z: depthOffset
        const histSeeds = new Float32Array(HIST_PARTICLE_COUNT * 3);
        const histScatter = new Float32Array(HIST_PARTICLE_COUNT * 3);
        const histSizeWeight = new Float32Array(HIST_PARTICLE_COUNT);

        for (let i = 0; i < HIST_PARTICLE_COUNT; i++) {
            let normX;
            let vSpread;
            let sizeW;

            // 앞쪽 42%: 전체 가로선 필라멘트를 구성 / 나머지 58%: 5개 지점에 원형 밀집도 형성
            if (i < HIST_PARTICLE_COUNT * 0.42) {
                normX = (Math.random() * 2.16 - 1.08);
                vSpread = gaussianRandom() * 0.036;
                sizeW = 0.85 + Math.random() * 0.7;
            } else {
                const nodeIdx = i % 5;
                const centerNX = HISTORY_NODE_NORM_X[nodeIdx];
                // 중심부에 원형 밀집도가 뚜렷하게 높고 양옆 선으로 부드럽게 녹아듦
                const clusterRadius = Math.abs(gaussianRandom()) * 0.048;
                const ang = Math.random() * Math.PI * 2;
                normX = centerNX + Math.cos(ang) * clusterRadius * 1.15;
                vSpread = Math.sin(ang) * clusterRadius * 1.45 + gaussianRandom() * 0.022;
                sizeW = 1.05 + Math.random() * 0.85;
            }

            histPositions[i * 3] = 0;
            histPositions[i * 3 + 1] = 0;
            histPositions[i * 3 + 2] = 0;

            histBaseData[i * 3] = normX;
            histBaseData[i * 3 + 1] = vSpread;
            histBaseData[i * 3 + 2] = gaussianRandom() * 0.035;

            histSeeds[i * 3] = Math.random();
            histSeeds[i * 3 + 1] = Math.random();
            histSeeds[i * 3 + 2] = Math.random();

            const scAngle = Math.random() * Math.PI * 2;
            const scRad = 1.2 + Math.random() * 4.5;
            histScatter[i * 3] = (Math.random() - 0.5) * 9.5;
            histScatter[i * 3 + 1] = Math.sin(scAngle) * scRad * 0.65;
            histScatter[i * 3 + 2] = (Math.random() - 0.5) * 4.0;

            histSizeWeight[i] = sizeW;
        }

        const historyLineGeo = new THREE.BufferGeometry();
        historyLineGeo.setAttribute('position', new THREE.BufferAttribute(histPositions, 3));
        historyLineGeo.setAttribute('aBase', new THREE.BufferAttribute(histBaseData, 3));
        historyLineGeo.setAttribute('aSeed', new THREE.BufferAttribute(histSeeds, 3));
        historyLineGeo.setAttribute('aScatter', new THREE.BufferAttribute(histScatter, 3));
        historyLineGeo.setAttribute('aSizeW', new THREE.BufferAttribute(histSizeWeight, 1));

        const historyLineMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
                uSpan: { value: historySpan },
                uCircleScale: { value: historyCircleScale },
                uConverge: { value: 0.0 },
                uOpacity: { value: 0.0 },
                uNodeNormX: { value: [...HISTORY_NODE_NORM_X] },
                uNodeOpen: { value: [0, 0, 0, 0, 0] }
            },
            vertexShader: `
                attribute vec3 aBase;
                attribute vec3 aSeed;
                attribute vec3 aScatter;
                attribute float aSizeW;

                uniform float uTime;
                uniform float uPixelRatio;
                uniform float uSpan;
                uniform float uCircleScale;
                uniform float uConverge;
                uniform float uNodeNormX[5];
                uniform float uNodeOpen[5];

                varying float vAlpha;
                varying float vRimBoost;
                varying float vClusterGlow;

                float evalWave(float nx, float t) {
                    return sin(nx * 4.2 - t * 1.15) * 0.052
                         + sin(nx * 8.6 + t * 0.78) * 0.020
                         + cos(nx * 2.1 - t * 0.55) * 0.032;
                }

                void main() {
                    float t = uTime;
                    // 가로선 위에서의 동적 유동 (호흡 및 미세 흐름)
                    float flowShift = sin(t * (0.45 + aSeed.x * 0.4) + aSeed.y * 6.2831) * 0.014;
                    float nx = aBase.x + flowShift;

                    float waveY = evalWave(nx, t);
                    float localJitterY = sin(t * (1.2 + aSeed.y * 1.4) + aSeed.z * 6.2831) * 0.014;

                    vec3 linePos = vec3(
                        nx * uSpan,
                        waveY + aBase.y + localJitterY,
                        aBase.z + cos(t * 0.9 + aSeed.x * 6.2831) * 0.018
                    );

                    // 5개 지점의 기본 밀집 밝기 및 원형 확장
                    float rimBoost = 0.0;
                    float clusterProximity = 0.0;
                    float inflR = 0.56 * uCircleScale;
                    float targetBaseR = 0.255 * uCircleScale;

                    for (int k = 0; k < 5; k++) {
                        float cnx = uNodeNormX[k];
                        vec2 center = vec2(cnx * uSpan, evalWave(cnx, t));
                        vec2 diff = linePos.xy - center;
                        float d = length(diff);

                        float prox = smoothstep(0.28 * uCircleScale, 0.0, d);
                        clusterProximity = max(clusterProximity, prox);

                        float openAmt = uNodeOpen[k];
                        if (openAmt > 0.001 && d < inflR) {
                            float normD = d / inflR;
                            float fallbackAng = aSeed.z * 6.2831853 + t * (0.4 + aSeed.x * 0.35);
                            vec2 radDir = (d > 0.012) ? normalize(diff) : vec2(cos(fallbackAng), sin(fallbackAng));

                            // 열릴 때 미세한 회전 와류
                            float swirl = openAmt * (1.0 - normD) * 0.52 * (aSeed.y - 0.3);
                            float cs = cos(swirl);
                            float sn = sin(swirl);
                            radDir = vec2(radDir.x * cs - radDir.y * sn, radDir.x * sn + radDir.y * cs);

                            float ringR = targetBaseR + (aSeed.y - 0.5) * 0.068 * uCircleScale;
                            float pushedR = mix(ringR, inflR, pow(normD, 1.38));
                            vec2 targetXY = center + radDir * pushedR;

                            // 중심부 입자들은 완전히 링 바깥으로 밀려나 내부에 깨끗한 원형 공간 확보
                            float pushWeight = openAmt * smoothstep(1.0, 0.72, normD * 0.95);
                            linePos.xy = mix(linePos.xy, targetXY, clamp(pushWeight, 0.0, 1.0));

                            float ringGlow = exp(-pow((pushedR - targetBaseR) / (0.065 * uCircleScale), 2.0));
                            rimBoost = max(rimBoost, openAmt * ringGlow);
                        }
                    }

                    // 수렴 컷신 보간
                    float pDelay = aSeed.x * 0.26;
                    float conv = clamp((uConverge - pDelay) / 0.74, 0.0, 1.0);
                    float convEase = 1.0 - pow(1.0 - conv, 3.0);

                    vec3 pos = mix(aScatter, linePos, convEase);

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_Position = projectionMatrix * mvPosition;

                    float edgeFade = smoothstep(1.12, 0.88, abs(nx));
                    vAlpha = (0.34 + clusterProximity * 0.32 + rimBoost * 0.48) * edgeFade;
                    vRimBoost = rimBoost;
                    vClusterGlow = clusterProximity;

                    float pSize = (1.65 * aSizeW + rimBoost * 1.15) * uPixelRatio;
                    gl_PointSize = pSize * (5.6 / -mvPosition.z);
                }
            `,
            fragmentShader: `
                uniform float uOpacity;
                varying float vAlpha;
                varying float vRimBoost;
                varying float vClusterGlow;

                void main() {
                    float dist = length(gl_PointCoord - vec2(0.5));
                    if (dist > 0.5) discard;

                    float soft = smoothstep(0.5, 0.06, dist);
                    vec3 col = mix(vec3(0.84, 0.87, 0.94), vec3(1.0, 1.0, 1.0), clamp(vClusterGlow * 0.6 + vRimBoost, 0.0, 1.0));
                    gl_FragColor = vec4(col, clamp(vAlpha * soft * uOpacity, 0.0, 0.95));
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const historyLinePoints = new THREE.Points(historyLineGeo, historyLineMat);
        historyGroup.add(historyLinePoints);

        // 5개 원형 확장 내부의 흰 점(코어 닷 + 외곽 조준 링 + 글로우)
        const historyCoreNodes = [];
        const coreDotGeo = new THREE.CircleGeometry(0.048, 32);
        const coreRingGeo = new THREE.RingGeometry(0.115, 0.123, 48);

        for (let i = 0; i < 5; i++) {
            const nodeGroup = new THREE.Group();

            const dotMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.0,
                depthWrite: false
            });
            const dotMesh = new THREE.Mesh(coreDotGeo, dotMat);

            const haloMat = new THREE.SpriteMaterial({
                map: glowTex,
                color: 0xffffff,
                transparent: true,
                opacity: 0.0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const haloSprite = new THREE.Sprite(haloMat);
            haloSprite.scale.set(0.32, 0.32, 0.32);

            const reticleMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.0,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const reticleMesh = new THREE.Mesh(coreRingGeo, reticleMat);

            nodeGroup.add(haloSprite);
            nodeGroup.add(dotMesh);
            nodeGroup.add(reticleMesh);
            historyGroup.add(nodeGroup);

            historyCoreNodes.push({
                group: nodeGroup,
                dotMesh,
                dotMat,
                haloSprite,
                haloMat,
                reticleMesh,
                reticleMat
            });
        }

        // 미세한 우주 배경 부유 먼지 (History 전용 깊이감 연출)
        const DUST_COUNT = 160;
        const dustPositions = new Float32Array(DUST_COUNT * 3);
        for (let i = 0; i < DUST_COUNT; i++) {
            dustPositions[i * 3] = (Math.random() - 0.5) * 12.0;
            dustPositions[i * 3 + 1] = (Math.random() - 0.5) * 6.5;
            dustPositions[i * 3 + 2] = (Math.random() - 0.5) * 3.5 - 1.0;
        }
        const dustGeo = new THREE.BufferGeometry();
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        const dustMat = new THREE.PointsMaterial({
            color: 0xdce4f5,
            size: 0.025,
            transparent: true,
            opacity: 0.0,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const historyDust = new THREE.Points(dustGeo, dustMat);
        historyGroup.add(historyDust);

        // 6. 호스트 푸른 모자이크 2D 캔버스
        const mosaicCanvas = document.getElementById('mosaic-canvas');
        const mosaicCtx = mosaicCanvas.getContext('2d');
        const MOSAIC_PALETTE = ['#051d4d', '#08348a', '#0c46b8', '#145ee8', '#062666', '#104ec9'];
        let mosaicTiles = [];
        let mosaicTileSize = 36;

        function initMosaicGrid() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            mosaicCanvas.width = w;
            mosaicCanvas.height = h;
            mosaicCanvas.style.display = 'block';
            mosaicCtx.clearRect(0, 0, w, h);

            mosaicTileSize = Math.max(26, Math.round(Math.min(w, h) / 22));
            const cols = Math.ceil(w / mosaicTileSize);
            const rows = Math.ceil(h / mosaicTileSize);
            mosaicTiles = [];

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    mosaicTiles.push({
                        x: c * mosaicTileSize,
                        y: r * mosaicTileSize,
                        color: MOSAIC_PALETTE[Math.floor(Math.random() * MOSAIC_PALETTE.length)],
                        threshold: Math.random() * 0.78
                    });
                }
            }
        }

        function drawMosaicFrame(p) {
            const w = mosaicCanvas.width;
            const h = mosaicCanvas.height;
            mosaicCtx.clearRect(0, 0, w, h);

            for (let i = 0; i < mosaicTiles.length; i++) {
                const tile = mosaicTiles[i];
                if (p >= tile.threshold) {
                    if (p > 0.8) {
                        const settleP = (p - 0.8) / 0.2;
                        mosaicCtx.fillStyle = (Math.random() < settleP) ? '#08348a' : tile.color;
                    } else {
                        if (Math.random() < 0.14) {
                            tile.color = MOSAIC_PALETTE[Math.floor(Math.random() * MOSAIC_PALETTE.length)];
                        }
                        mosaicCtx.fillStyle = tile.color;
                    }
                    mosaicCtx.fillRect(tile.x, tile.y, mosaicTileSize + 1, mosaicTileSize + 1);
                }
            }
        }

        // 7. 후처리(Post-Processing)
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        const PostProcessShader = {
            uniforms: {
                tDiffuse: { value: null },
                uTime: { value: 0 },
                uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                uBgColor: { value: MAIN_BG_COLOR.clone() },
                uAnaglyph: { value: 0.0 },
                uFlashWhite: { value: 0.0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uTime;
                uniform vec2 uResolution;
                uniform vec3 uBgColor;
                uniform float uAnaglyph;
                uniform float uFlashWhite;
                varying vec2 vUv;

                void main() {
                    vec2 center = vUv - 0.5;
                    float dist = length(center);

                    vec2 dir = normalize(center + 0.0001);
                    vec2 slantDir = normalize(dir + vec2(0.6, -0.4));
                    
                    float aberrationAmount = (0.0008 + pow(dist, 1.8) * 0.0055);
                    vec2 anaglyphShift = vec2(uAnaglyph * 0.017, 0.0);

                    vec2 offsetR = slantDir * aberrationAmount * 1.1 - anaglyphShift;
                    vec2 offsetG = slantDir * aberrationAmount * 0.1 + anaglyphShift * 0.9;
                    vec2 offsetB = -slantDir * aberrationAmount * 1.1 + anaglyphShift;

                    float r = texture2D(tDiffuse, vUv + offsetR).r;
                    float g = texture2D(tDiffuse, vUv + offsetG).g;
                    float b = texture2D(tDiffuse, vUv + offsetB).b;

                    vec3 finalColor = vec3(r, g, b);
                    
                    float edge = abs(r - b) + abs(r - g);
                    finalColor += vec3(r * 0.25, g * 0.2, b * 0.32) * smoothstep(0.12, 0.65, edge) * 0.5;

                    if (uAnaglyph > 0.001) {
                        vec3 redChannel = vec3(r * 1.45, 0.0, 0.0);
                        vec3 cyanChannel = vec3(0.0, g * 1.2, b * 1.45);
                        vec3 vividAnaglyph = redChannel + cyanChannel;
                        finalColor = mix(finalColor, vividAnaglyph, clamp(uAnaglyph * 0.95, 0.0, 1.0));
                    }

                    finalColor = pow(finalColor, vec3(1.02)) * 1.1;

                    vec3 composited = clamp(uBgColor + finalColor, 0.0, 1.0);
                    composited = mix(composited, vec3(1.0), clamp(uFlashWhite, 0.0, 1.0));

                    gl_FragColor = vec4(composited, 1.0);
                }
            `
        };

        const postPass = new ShaderPass(PostProcessShader);
        composer.addPass(postPass);

        // 8. HUD 텍스트 스크램블 애니메이션 & 렌더링
        const hudOverlay = document.getElementById('hud-overlay');
        let scrambleTimers = [];

        function clearScrambleTimers() {
            scrambleTimers.forEach(id => clearInterval(id));
            scrambleTimers = [];
        }

        function scrambleReveal(el, finalText, duration = 650, delay = 0) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/#*+';
            el.textContent = '';
            const startAt = performance.now() + delay;

            const timer = setInterval(() => {
                const now = performance.now();
                if (now < startAt) return;
                const progress = Math.min(1, (now - startAt) / duration);
                const revealedCount = Math.floor(progress * finalText.length);

                let out = '';
                for (let i = 0; i < finalText.length; i++) {
                    const ch = finalText[i];
                    if (i < revealedCount || ch === ' ' || ch === '\n') {
                        out += ch;
                    } else {
                        out += chars[Math.floor(Math.random() * chars.length)];
                    }
                }
                el.textContent = out;

                if (progress >= 1) {
                    el.textContent = finalText;
                    clearInterval(timer);
                }
            }, 30);
            scrambleTimers.push(timer);
        }

        function showCharacterHUD(charKey) {

        // 8-2. [역사 / HISTORY] UI 컨트롤 및 마커 초기화
        const historyUI = document.getElementById('history-ui');
        const historyMarkersContainer = document.getElementById('history-markers');
        const historyReturnBtn = document.getElementById('history-return-btn');
        const historyPanel = document.getElementById('history-panel');

        const historyEraName = document.getElementById('history-era-name');
        const historyEraSub = document.getElementById('history-era-sub');
        const historyPanelBody = document.getElementById('history-panel-body');
        const historyPrevBtn = document.getElementById('history-prev-btn');
        const historyNextBtn = document.getElementById('history-next-btn');
        const historyClosePanelBtn = document.getElementById('history-close-panel-btn');

        const historyMarkerEls = HISTORY_DATA.map((item, idx) => {
            const el = document.createElement('div');

                <div class="history-marker-tag">${item.title}</div>

        function updateHistoryMarkerClasses() {
            const nextSuggested = selectedHistoryNode >= 0 && selectedHistoryNode < 4
                ? selectedHistoryNode + 1
                : (visitedHistoryNodes.size === 0 ? 0 : -1);

            historyMarkerEls.forEach((el, idx) => {
                el.classList.toggle('hovered', hoveredHistoryNode === idx);
                el.classList.toggle('selected', selectedHistoryNode === idx);
                el.classList.toggle('visited', visitedHistoryNodes.has(idx));
                el.classList.toggle('next-cue', nextSuggested === idx);
            });
        }

        function selectHistoryNode(idx) {
            if (idx < 0 || idx >= HISTORY_DATA.length) return;
            selectedHistoryNode = idx;
            visitedHistoryNodes.add(idx);

            const item = HISTORY_DATA[idx];
            clearScrambleTimers();

            historyEraCode.textContent = `${item.code} / 05`;
            historyEraName.textContent = item.title;
            historyEraSub.textContent = item.subtitle;

            scrambleReveal(historyEraName, item.title, 380, 0);
            scrambleReveal(historyEraSub, item.subtitle, 450, 40);

            historyPanelBody.innerHTML = `<div class="history-text-fade"><span class="history-lead-word">${item.lead}</span> ${item.text}</div>`;
            historyPanelBody.scrollTop = 0;

            historyPrevBtn.disabled = (idx === 0);
            historyNextBtn.disabled = (idx === HISTORY_DATA.length - 1);

            historyPanel.classList.add('visible');
            updateHistoryMarkerClasses();
        }

        function closeHistoryTextPanel() {
            selectedHistoryNode = -1;
            historyPanel.classList.remove('visible');
            updateHistoryMarkerClasses();
        }

        historyPrevBtn.addEventListener('click', () => {
            if (selectedHistoryNode > 0) selectHistoryNode(selectedHistoryNode - 1);

        historyNextBtn.addEventListener('click', () => {
            if (selectedHistoryNode < HISTORY_DATA.length - 1) selectHistoryNode(selectedHistoryNode + 1);
        });
        historyClosePanelBtn.addEventListener('click', closeHistoryTextPanel);
        historyReturnBtn.addEventListener('click', () => exitHistorySequence());

        window.addEventListener('keydown', (e) => {
            if (seqState === 'HISTORY_ACTIVE') {
                if (e.key === 'Escape') {
                    exitHistorySequence();
                } else if (e.key === 'ArrowRight') {
                    const nextIdx = selectedHistoryNode < 0 ? 0 : Math.min(HISTORY_DATA.length - 1, selectedHistoryNode + 1);
                    selectHistoryNode(nextIdx);
                } else if (e.key === 'ArrowLeft') {
                    const prevIdx = selectedHistoryNode <= 0 ? 0 : selectedHistoryNode - 1;
                    selectHistoryNode(prevIdx);
                }
            }
        });

        // 9. 상태 머신 및 인터랙션 (최초 진입 시 INTRO_CUTSCENE 실행)
        let seqState = 'INTRO_CUTSCENE';
        let seqStartTime = 0;
        let isOrbActive = true;
        let activeCharKey = null;
        let hudEnteredTime = 0;

        let chosenClone = null;
        let focusTargetPos = new THREE.Vector3();

        const commandWrapper = document.getElementById('command-wrapper');
        const commandInput = document.getElementById('command-input');
        const genesisText = document.getElementById('genesis-text');

        ['pointerdown', 'mousedown', 'click'].forEach(evt => {
            commandWrapper.addEventListener(evt, (e) => e.stopPropagation());
        });

        function triggerGodSequence() {
            if (seqState !== 'NORMAL') return;
            seqState = 'SHRINKING';
            seqStartTime = clock.getElapsedTime();
            commandInput.blur();
            commandWrapper.classList.add('hidden');
        }

        function triggerCharSequence(charKey) {
            if (seqState !== 'NORMAL') return;
            activeCharKey = charKey;
            seqState = 'CHAR_ORB_EXIT';
            seqStartTime = clock.getElapsedTime();
            commandInput.blur();
            commandWrapper.classList.add('hidden');
        }

        function triggerDarekaSequence() {
            if (seqState !== 'NORMAL') return;
            activeCharKey = 'dareka';
            commandInput.blur();
            commandWrapper.classList.add('hidden');

            buildDarekaGrid();
            darekaGroup.position.set(0, 0, 0);
            scene.add(darekaGroup);

            seqState = 'DAREKA_MULTIPLY';
            seqStartTime = clock.getElapsedTime();
        }

        function triggerHistorySequence() {
            if (seqState !== 'NORMAL') return;
            commandInput.blur();
            commandWrapper.classList.add('hidden');
            document.body.classList.add('history-mode');
            seqState = 'HISTORY_ORB_EXIT';
            seqStartTime = clock.getElapsedTime();
        }

        function exitHistorySequence() {
            if (seqState !== 'HISTORY_ACTIVE' && seqState !== 'HISTORY_CONVERGE') return;
            clearScrambleTimers();
            historyUI.classList.remove('active');
            historyPanel.classList.remove('visible');
            document.body.classList.remove('history-mode', 'history-hover');

            hoveredHistoryNode = -1;
            selectedHistoryNode = -1;

            seqState = 'HISTORY_RESTORING';
            seqStartTime = clock.getElapsedTime();
        }

        function handleCommandValue(raw) {
            const rawTrim = raw.trim();
            const val = rawTrim.toUpperCase();
            if (val === 'GOD') {
                triggerGodSequence();
            } else if (val === 'WHO' || rawTrim === '누구지') {
                triggerCharSequence('who');
            } else if (val === 'HOST' || rawTrim === '호스트') {
                triggerCharSequence('host');
            } else if (rawTrim === '다레카' || rawTrim === 'だれか') {
                triggerDarekaSequence();
            } else if (val === 'HISTORY' || rawTrim === '역사') {
                triggerHistorySequence();
            }
        }

        commandInput.addEventListener('input', (e) => handleCommandValue(e.target.value));
        commandInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleCommandValue(e.target.value);
        });

        function closeCharacterEvent() {
            if (seqState !== 'CHAR_HUD') return;
            if (clock.getElapsedTime() - hudEnteredTime < 0.45) return;

            clearScrambleTimers();
            hudOverlay.classList.remove('active');

            camera.position.set(0, 0, CAMERA_DEFAULT_Z);
            scene.add(masterGroup);
            masterGroup.position.set(0, ORB_CENTER_Y, 0);
            masterGroup.scale.setScalar(0.001);
            isOrbActive = true;

            seqState = 'CHAR_RESTORING';
            seqStartTime = clock.getElapsedTime();
        }

        hudOverlay.addEventListener('click', closeCharacterEvent);

        const mouseNDC = new THREE.Vector2(999, 999);
        const raycaster = new THREE.Raycaster();
        const interactPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        const worldMousePos = new THREE.Vector3(999, 999, 0);
        const localMousePos = new THREE.Vector3(999, 999, 0);
        let isMouseInside = false;

        let isDragging = false;
        let prevPointer = { x: 0, y: 0 };
        let rotVelocity = { x: 0, y: 0 };

        const qYaw = new THREE.Quaternion();
        const qPitch = new THREE.Quaternion();
        const axisY = new THREE.Vector3(0, 1, 0);
        const axisX = new THREE.Vector3(1, 0, 0);

        function hitTestHistoryNode(clientX, clientY) {
            const ndc = new THREE.Vector2(
                (clientX / window.innerWidth) * 2 - 1,
                -(clientY / window.innerHeight) * 2 + 1
            );
            raycaster.setFromCamera(ndc, camera);
            const hit = new THREE.Vector3();
            raycaster.ray.intersectPlane(interactPlane, hit);

            let bestIdx = -1;
            let bestDist = 0.48 * historyCircleScale;
            for (let i = 0; i < 5; i++) {
                const dx = hit.x - historyNodeWorldPositions[i].x;
                const dy = hit.y - historyNodeWorldPositions[i].y;
                const d = Math.hypot(dx, dy);
                if (d < bestDist) {
                    bestDist = d;
                    bestIdx = i;
                }
            }
            return bestIdx;
        }

        window.addEventListener('pointerdown', (e) => {
            if (seqState === 'CHAR_HUD') {
                closeCharacterEvent();
                return;
            }
            if (seqState === 'HISTORY_ACTIVE') {
                const hitIdx = hitTestHistoryNode(e.clientX, e.clientY);
                if (hitIdx !== -1) {
                    selectHistoryNode(hitIdx);
                }
                return;
            }
            if (seqState !== 'NORMAL') return;
            isDragging = true;
            prevPointer.x = e.clientX;
            prevPointer.y = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
            isMouseInside = true;
            mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;

            if (isDragging && seqState === 'NORMAL') {
                const dx = e.clientX - prevPointer.x;
                const dy = e.clientY - prevPointer.y;

                rotVelocity.y = dx * 0.0055;
                rotVelocity.x = dy * 0.0055;

                prevPointer.x = e.clientX;
                prevPointer.y = e.clientY;
            }
        });

        window.addEventListener('pointerup', () => {
            isDragging = false;
        });

        window.addEventListener('pointerleave', () => {
            isDragging = false;
            isMouseInside = false;
        });

        // 10. 동적 애니메이션 루프
        const clock = new THREE.Clock();
        const tempVec = new THREE.Vector3();
        const projVec = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            let currentAnaglyph = 0.0;
            let currentFlashWhite = 0.0;
            let introNodeRadiusFactor = 1.0;

            // --- 사이트 최초 진입 인트로 어셈블리 컷신 ---
            if (seqState === 'INTRO_CUTSCENE') {
                const duration = 3.3;
                const dt = elapsedTime - seqStartTime;
                const p = Math.min(1.0, dt / duration);
                const camEase = 1.0 - Math.pow(1.0 - p, 3.0);

                camera.position.z = THREE.MathUtils.lerp(9.2, CAMERA_DEFAULT_Z, camEase);

                const coreProg = Math.min(1.0, dt / 2.4);
                coreShellMat.uniforms.uIntroAssemble.value = coreProg;
                coreShellMat.uniforms.uIntroAlpha.value = Math.min(1.0, dt / 0.55);

                const ringProg = THREE.MathUtils.clamp((dt - 0.9) / 1.5, 0.0, 1.0);
                ringMaterial.opacity = 0.26 * (1.0 - Math.pow(1.0 - ringProg, 2.0));

                const nodeProg = THREE.MathUtils.clamp((dt - 1.7) / 1.4, 0.0, 1.0);
                const nodeEase = 1.0 - Math.pow(1.0 - nodeProg, 3.0);
                introNodeRadiusFactor = 0.35 + 0.65 * nodeEase;
                outerMat.uniforms.uOpacity.value = nodeEase;
                linesMat.opacity = 0.78 * THREE.MathUtils.smoothstep(nodeProg, 0.25, 1.0);

                if (dt > 2.4 && dt < 3.2) {
                    const pulseP = (dt - 2.4) / 0.8;
                    currentAnaglyph = Math.sin(pulseP * Math.PI) * 0.28;
                }

                masterGroup.rotation.y = (1.0 - camEase) * -0.9;

                if (p >= 1.0) {
                    camera.position.z = CAMERA_DEFAULT_Z;
                    coreShellMat.uniforms.uIntroAssemble.value = 1.0;
                    coreShellMat.uniforms.uIntroAlpha.value = 1.0;
                    ringMaterial.opacity = 0.26;
                    outerMat.uniforms.uOpacity.value = 1.0;
                    linesMat.opacity = 0.78;
                    seqState = 'NORMAL';
                    commandWrapper.classList.remove('hidden');
                }
            }

            // --- [역사 / HISTORY] 시퀀스 ---
            else if (seqState === 'HISTORY_ORB_EXIT') {
                const dt = elapsedTime - seqStartTime;
                const duration = 0.75;
                const p = Math.min(1.0, dt / duration);
                const easeIn = Math.pow(p, 2.2);

                masterGroup.scale.setScalar(Math.max(0.03, 1.0 - easeIn * 0.96));
                masterGroup.position.y = ORB_CENTER_Y + easeIn * 7.8;
                currentBgVec.lerpVectors(MAIN_BG_COLOR, HISTORY_BG_COLOR, p);

                if (p >= 1.0) {
                    scene.remove(masterGroup);
                    isOrbActive = false;

                    hoveredHistoryNode = -1;
                    selectedHistoryNode = -1;
                    visitedHistoryNodes.clear();
                    historyNodeOpenCurrent.fill(0);
                    historyLineMat.uniforms.uNodeOpen.value = [0, 0, 0, 0, 0];

                    updateHistoryLayout();
                    updateHistoryMarkerClasses();

                    historyLineMat.uniforms.uConverge.value = 0.0;
                    historyLineMat.uniforms.uOpacity.value = 0.0;
                    dustMat.opacity = 0.0;

                    scene.add(historyGroup);
                    seqState = 'HISTORY_CONVERGE';
                    seqStartTime = elapsedTime;
                }
            } else if (seqState === 'HISTORY_CONVERGE') {
                const dt = elapsedTime - seqStartTime;
                const duration = 1.45;
                const p = Math.min(1.0, dt / duration);
                const ease = 1.0 - Math.pow(1.0 - p, 3.0);

                historyLineMat.uniforms.uConverge.value = ease;
                historyLineMat.uniforms.uOpacity.value = Math.min(1.0, p * 1.4);
                dustMat.opacity = 0.32 * ease;

                if (p >= 1.0) {
                    historyLineMat.uniforms.uConverge.value = 1.0;
                    historyLineMat.uniforms.uOpacity.value = 1.0;
                    dustMat.opacity = 0.32;
                    seqState = 'HISTORY_ACTIVE';
                    historyUI.classList.add('active');
                }
            } else if (seqState === 'HISTORY_RESTORING') {
                const dt = elapsedTime - seqStartTime;
                const duration = 0.85;
                const p = Math.min(1.0, dt / duration);
                const easeIn = Math.pow(p, 2.0);
                const easeOut = 1.0 - Math.pow(1.0 - p, 3.0);

                historyLineMat.uniforms.uConverge.value = Math.max(0.0, 1.0 - easeIn * 1.15);
                historyLineMat.uniforms.uOpacity.value = Math.max(0.0, 1.0 - p * 1.65);
                dustMat.opacity = 0.32 * Math.max(0.0, 1.0 - p * 1.65);
                currentBgVec.lerpVectors(HISTORY_BG_COLOR, MAIN_BG_COLOR, easeOut);

                if (p >= 0.35 && !isOrbActive) {
                    scene.add(masterGroup);
                    masterGroup.position.set(0, ORB_CENTER_Y, 0);
                    masterGroup.scale.setScalar(0.001);
                    isOrbActive = true;
                }
                if (isOrbActive) {
                    const orbP = Math.max(0.0, (p - 0.35) / 0.65);
                    const orbEase = 1.0 - Math.pow(1.0 - orbP, 3.0);
                    masterGroup.scale.setScalar(Math.max(0.001, orbEase));
                }

                if (p >= 1.0) {
                    scene.remove(historyGroup);
                    currentBgVec.copy(MAIN_BG_COLOR);
                    masterGroup.scale.setScalar(1.0);
                    seqState = 'NORMAL';
                    commandInput.value = '';
                    commandWrapper.classList.remove('hidden');
                }
            }

            // --- GOD 시퀀스 ---
            else if (seqState === 'SHRINKING') {
                const dt = elapsedTime - seqStartTime;
                const duration = 0.65;
                const p = Math.min(1.0, dt / duration);
                const scale = Math.max(0.001, Math.pow(1.0 - p, 2.5));
                masterGroup.scale.setScalar(scale);

                if (p >= 1.0) {
                    scene.remove(masterGroup);
                    isOrbActive = false;

                    scene.add(sixSpheresGroup);
                    sixSpheresGroup.scale.setScalar(1.0);
                    whiteSphereMat.uniforms.uOpacity.value = 1.0;
                    seqState = 'GATHERING';
                    seqStartTime = elapsedTime;
                }
            } else if (seqState === 'GATHERING') {
                const dt = elapsedTime - seqStartTime;
                const duration = 1.85;
                const p = Math.min(1.0, dt / duration);
                const ease = 1.0 - Math.pow(1.0 - p, 3.0);

                sixSpheres.forEach((s) => {
                    const r = s.startRadius * (1.0 - ease);
                    const angle = s.startAngle + p * Math.PI * 3.2;
                    const x = Math.cos(angle) * r;
                    const y = Math.sin(angle) * r * Math.cos(s.orbitTilt);
                    const z = Math.sin(angle) * r * Math.sin(s.orbitTilt) + s.startZ * (1.0 - ease);

                    s.container.position.set(x, y, z);
                    s.container.scale.setScalar(0.85 + ease * 0.25);
                    s.haloMat.opacity = 0.72;
                });

                if (p >= 1.0) {
                    seqState = 'TREMBLING';
                    seqStartTime = elapsedTime;
                }
            } else if (seqState === 'TREMBLING') {
                const dt = elapsedTime - seqStartTime;
                const duration = 3.40;
                const p = Math.min(1.0, dt / duration);
                const shakeAmp = (0.025 + p * 0.1) * 1.5;
                const slowExpand = 1.0 + Math.pow(p, 1.4) * 0.425;

                sixSpheres.forEach((s, idx) => {
                    s.container.position.set(
                        Math.sin(elapsedTime * 85.0 + idx * 1.7) * shakeAmp,
                        Math.cos(elapsedTime * 92.0 + idx * 2.3) * shakeAmp,
                        Math.sin(elapsedTime * 78.0 + idx * 3.1) * shakeAmp
                    );
                    s.container.scale.setScalar(slowExpand);
                });
                currentAnaglyph = p * 0.65;

                if (p >= 1.0) {
                    seqState = 'EXPLODING';
                    seqStartTime = elapsedTime;
                }
            } else if (seqState === 'EXPLODING') {
                const dt = elapsedTime - seqStartTime;
                const duration = 0.28;
                const p = Math.min(1.0, dt / duration);
                const expEase = Math.pow(p, 1.6);

                sixSpheres.forEach((s) => {
                    const spread = expEase * 4.5;
                    s.container.position.set(
                        Math.cos(s.startAngle) * spread * 0.4,
                        Math.sin(s.startAngle) * spread * 0.4,
                        expEase * 2.4
                    );
                    s.container.scale.setScalar(1.425 + expEase * 32.0);
                    s.haloMat.opacity = 0.92;
                });

                currentAnaglyph = Math.sin(p * Math.PI) * 1.35;
                currentFlashWhite = THREE.MathUtils.smoothstep(p, 0.22, 0.9);

                if (p >= 1.0) {
                    scene.remove(sixSpheresGroup);
                    seqState = 'LIGHT_TEXT';
                    seqStartTime = elapsedTime;
                    genesisText.classList.add('visible');
                }
            } else if (seqState === 'LIGHT_TEXT') {
                currentFlashWhite = 1.0;
                const dt = elapsedTime - seqStartTime;
                if (dt >= 3.0) {
                    genesisText.classList.remove('visible');
                    scene.add(masterGroup);
                    masterGroup.position.set(0, ORB_CENTER_Y, 0);
                    masterGroup.scale.setScalar(0.001);
                    isOrbActive = true;
                    seqState = 'RESTORING';
                    seqStartTime = elapsedTime;
                }
            } else if (seqState === 'RESTORING') {
                const dt = elapsedTime - seqStartTime;
                const duration = 0.85;
                const p = Math.min(1.0, dt / duration);
                const easeOut = 1.0 - Math.pow(1.0 - p, 3.0);

                currentFlashWhite = 1.0 - easeOut;
                masterGroup.scale.setScalar(Math.max(0.001, easeOut));

                if (p >= 1.0) {
                    masterGroup.scale.setScalar(1.0);
                    seqState = 'NORMAL';
                    commandInput.value = '';
                    commandWrapper.classList.remove('hidden');
                }
            }

            // --- 다레카 시퀀스 ---
            else if (seqState === 'DAREKA_MULTIPLY') {
                const dt = elapsedTime - seqStartTime;
                const duration = 1.55;
                const p = Math.min(1.0, dt / duration);
                const ease = 1.0 - Math.pow(1.0 - p, 3.0);

                masterGroup.scale.setScalar(1.0 - ease * 0.74);

                darekaClones.forEach((c) => {
                    c.group.position.lerpVectors(c.startPos, c.gridPos, ease);
                    c.group.scale.setScalar(0.85 - ease * 0.59);
                });

                if (p >= 1.0) {
                    const candidates = darekaClones.filter(c => c.canFocus);
                    chosenClone = candidates[Math.floor(Math.random() * candidates.length)] || darekaClones[0];
                    chosenClone.shell.geometry = coreShellGeo;
                    focusTargetPos.copy(chosenClone.gridPos);

                    seqState = 'DAREKA_CAMERA_PAN';
                    seqStartTime = elapsedTime;
                }
            } else if (seqState === 'DAREKA_CAMERA_PAN') {
                const dt = elapsedTime - seqStartTime;
                const duration = 0.85;
                const p = Math.min(1.0, dt / duration);
                const ease = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

                camera.position.x = THREE.MathUtils.lerp(0, focusTargetPos.x, ease);
                camera.position.y = THREE.MathUtils.lerp(0, focusTargetPos.y, ease);
                camera.position.z = CAMERA_DEFAULT_Z;

                if (p >= 1.0) {
                    seqState = 'DAREKA_CAMERA_ZOOM';
                    seqStartTime = elapsedTime;
                }
            } else if (seqState === 'DAREKA_CAMERA_ZOOM') {
                const dt = elapsedTime - seqStartTime;
                const duration = 0.85;
                const p = Math.min(1.0, dt / duration);
                const ease = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

                camera.position.z = THREE.MathUtils.lerp(CAMERA_DEFAULT_Z, CAMERA_DEFAULT_Z * 0.26, ease);

                if (p >= 1.0) {
                    scene.remove(masterGroup);
                    isOrbActive = false;

                    darekaClones.forEach((c) => {
                        c.group.visible = (c === chosenClone);
                    });

                    seqState = 'DAREKA_ORB_EXIT';
                    seqStartTime = elapsedTime;
                }
            } else if (seqState === 'DAREKA_ORB_EXIT') {
                const dt = elapsedTime - seqStartTime;
                const duration = 0.72;
                const p = Math.min(1.0, dt / duration);
                const easeIn = Math.pow(p, 2.2);

                chosenClone.group.scale.setScalar(Math.max(0.015, 0.26 * (1.0 - easeIn * 0.94)));
                chosenClone.group.position.y = focusTargetPos.y + easeIn * 2.4;

                if (p >= 1.0) {
                    scene.remove(darekaGroup);
                    camera.position.set(0, 0, CAMERA_DEFAULT_Z);
                    seqState = 'CHAR_HUD';
                    hudEnteredTime = elapsedTime;
                    showCharacterHUD('dareka');
                }
            }

            // --- 캐릭터 공통 퇴장 & 호스트 푸른 모자이크 & 복구 ---
            else if (seqState === 'CHAR_ORB_EXIT') {
                const dt = elapsedTime - seqStartTime;
                const duration = 0.72;
                const p = Math.min(1.0, dt / duration);
                const easeIn = Math.pow(p, 2.2);

                masterGroup.scale.setScalar(Math.max(0.06, 1.0 - easeIn * 0.92));
                masterGroup.position.y = ORB_CENTER_Y + easeIn * 7.2;

                if (p >= 1.0) {
                    scene.remove(masterGroup);
                    isOrbActive = false;

                    if (activeCharKey === 'host') {
                        initMosaicGrid();
                        seqState = 'HOST_BLUE_MOSAIC';
                        seqStartTime = elapsedTime;
                    } else {
                        seqState = 'CHAR_HUD';
                        hudEnteredTime = elapsedTime;
                        showCharacterHUD(activeCharKey);
                    }
                }
            } else if (seqState === 'HOST_BLUE_MOSAIC') {
                const dt = elapsedTime - seqStartTime;
                const duration = 1.35;
                const p = Math.min(1.0, dt / duration);

                drawMosaicFrame(p);
                currentBgVec.lerpVectors(MAIN_BG_COLOR, HOST_BLUE_COLOR, Math.min(1.0, p * 1.15));

                if (p >= 1.0) {
                    currentBgVec.copy(HOST_BLUE_COLOR);
                    document.body.style.backgroundColor = '#08348a';
                    mosaicCanvas.style.display = 'none';
                    seqState = 'CHAR_HUD';
                    hudEnteredTime = elapsedTime;
                    showCharacterHUD('host');
                }
            } else if (seqState === 'CHAR_RESTORING') {
                const dt = elapsedTime - seqStartTime;
                const duration = 0.75;
                const p = Math.min(1.0, dt / duration);
                const easeOut = 1.0 - Math.pow(1.0 - p, 3.0);

                if (activeCharKey === 'host') {
                    currentBgVec.lerpVectors(HOST_BLUE_COLOR, MAIN_BG_COLOR, easeOut);
                }
                masterGroup.scale.setScalar(Math.max(0.001, easeOut));

                if (p >= 1.0) {
                    currentBgVec.copy(MAIN_BG_COLOR);
                    document.body.style.backgroundColor = '#1c1c1c';
                    masterGroup.scale.setScalar(1.0);
                    activeCharKey = null;
                    seqState = 'NORMAL';
                    commandInput.value = '';
                    commandWrapper.classList.remove('hidden');
                }
            }

            // --- [역사 / HISTORY] 실시간 파동, 원형 확장 & 내부 흰 점 연산 ---
            if (seqState === 'HISTORY_CONVERGE' || seqState === 'HISTORY_ACTIVE' || seqState === 'HISTORY_RESTORING') {
                historyLineMat.uniforms.uTime.value = elapsedTime;
                historyDust.rotation.y = Math.sin(elapsedTime * 0.08) * 0.06;

                let newHover = -1;
                if (seqState === 'HISTORY_ACTIVE' && isMouseInside) {
                    raycaster.setFromCamera(mouseNDC, camera);
                    raycaster.ray.intersectPlane(interactPlane, worldMousePos);

                    let minDist = 0.45 * historyCircleScale;
                    for (let i = 0; i < 5; i++) {
                        const d = Math.hypot(
                            worldMousePos.x - historyNodeWorldPositions[i].x,
                            worldMousePos.y - historyNodeWorldPositions[i].y
                        );
                        if (d < minDist) {
                            minDist = d;
                            newHover = i;
                        }
                    }
                }

                if (seqState === 'HISTORY_ACTIVE' && newHover !== hoveredHistoryNode) {
                    hoveredHistoryNode = newHover;
                    document.body.classList.toggle('history-hover', hoveredHistoryNode !== -1);
                    updateHistoryMarkerClasses();
                }

                const winW = window.innerWidth;
                const winH = window.innerHeight;

                for (let i = 0; i < 5; i++) {
                    const nx = HISTORY_NODE_NORM_X[i];
                    const localX = nx * historySpan;
                    const localY = evalHistoryWave(nx, elapsedTime);

                    historyNodeWorldPositions[i].set(localX, historyLineY + localY, 0);

                    const targetOpen = (seqState === 'HISTORY_ACTIVE' && (hoveredHistoryNode === i || selectedHistoryNode === i)) ? 1.0 : 0.0;
                    historyNodeOpenCurrent[i] += (targetOpen - historyNodeOpenCurrent[i]) * 0.14;
                    if (Math.abs(targetOpen - historyNodeOpenCurrent[i]) < 0.001) {
                        historyNodeOpenCurrent[i] = targetOpen;
                    }
                    historyLineMat.uniforms.uNodeOpen.value[i] = historyNodeOpenCurrent[i];

                    const openAmt = historyNodeOpenCurrent[i];
                    const core = historyCoreNodes[i];
                    core.group.position.set(localX, localY, 0.03);

                    const pulse = (selectedHistoryNode === i) ? (1.0 + Math.sin(elapsedTime * 3.8) * 0.14) : 1.0;
                    const dotScale = Math.max(0.001, openAmt * historyCircleScale * pulse);
                    core.dotMesh.scale.setScalar(dotScale);
                    core.dotMat.opacity = Math.min(1.0, openAmt * 1.15);

                    core.haloSprite.scale.setScalar(Math.max(0.001, 0.36 * openAmt * historyCircleScale * pulse));
                    core.haloMat.opacity = 0.85 * openAmt;

                    core.reticleMesh.scale.setScalar(Math.max(0.001, (0.75 + 0.25 * openAmt) * historyCircleScale));
                    core.reticleMat.opacity = (selectedHistoryNode === i ? 0.55 : 0.28) * openAmt;
                    core.reticleMesh.rotation.z = elapsedTime * 0.4 + i;

                    if (seqState === 'HISTORY_ACTIVE') {
                        projVec.copy(historyNodeWorldPositions[i]).project(camera);
                        const sx = (projVec.x * 0.5 + 0.5) * winW;
                        const sy = (-projVec.y * 0.5 + 0.5) * winH;
                        historyMarkerEls[i].style.left = `${sx.toFixed(1)}px`;
                        historyMarkerEls[i].style.top = `${sy.toFixed(1)}px`;
                    }
                }
            }

            coreShellMat.uniforms.uTime.value = elapsedTime;

            // --- 오브 활성 상태 연산 ---
            if (isOrbActive) {
                if (Math.abs(rotVelocity.x) > 0.00001 || Math.abs(rotVelocity.y) > 0.00001) {
                    qYaw.setFromAxisAngle(axisY, rotVelocity.y);
                    qPitch.setFromAxisAngle(axisX, rotVelocity.x);
                    masterGroup.quaternion.premultiply(qYaw);
                    masterGroup.quaternion.premultiply(qPitch);
                    masterGroup.quaternion.normalize();
                }

                if (!isDragging) {
                    rotVelocity.x *= 0.94;
                    rotVelocity.y *= 0.94;

                    if (isMouseInside && seqState === 'NORMAL') {
                        const hoverTiltY = mouseNDC.x * 0.0005;
                        const hoverTiltX = -mouseNDC.y * 0.0005;
                        qYaw.setFromAxisAngle(axisY, hoverTiltY);
                        qPitch.setFromAxisAngle(axisX, hoverTiltX);
                        masterGroup.quaternion.premultiply(qYaw);
                        masterGroup.quaternion.premultiply(qPitch);
                    }
                }

                masterGroup.updateMatrixWorld();

                if (isMouseInside && seqState === 'NORMAL') {
                    raycaster.setFromCamera(mouseNDC, camera);
                    raycaster.ray.intersectPlane(interactPlane, worldMousePos);
                    localMousePos.copy(worldMousePos);
                    masterGroup.worldToLocal(localMousePos);
                } else {
                    localMousePos.set(999, 999, 999);
                }

                orbitConfigs.forEach((cfg, idx) => {
                    let introRingScale = 1.0;
                    let introRingSpin = 0.0;
                    if (seqState === 'INTRO_CUTSCENE') {
                        const ringStart = 0.9 + idx * 0.28;
                        const rp = THREE.MathUtils.clamp((elapsedTime - ringStart) / 0.95, 0.0, 1.0);
                        const rEase = 1.0 - Math.pow(1.0 - rp, 3.0);
                        introRingScale = Math.max(0.001, rEase);
                        introRingSpin = (1.0 - rEase) * 2.2;
                    }

                    cfg.group.rotation.x = cfg.baseRot.x + elapsedTime * cfg.rotSpeed.x + Math.sin(elapsedTime * cfg.wobbleFreq + idx) * cfg.wobbleAmp;
                    cfg.group.rotation.y = cfg.baseRot.y + elapsedTime * cfg.rotSpeed.y + Math.cos(elapsedTime * cfg.wobbleFreq + idx) * cfg.wobbleAmp + introRingSpin;
                    cfg.group.rotation.z = cfg.baseRot.z + elapsedTime * cfg.rotSpeed.z;

                    const breathe = 1.0 + Math.sin(elapsedTime * 1.1 + idx * 2.0) * 0.04;
                    cfg.group.scale.setScalar(breathe * introRingScale);
                    cfg.group.updateMatrix();
                });

                for (let i = 0; i < 3; i++) {
                    const cfg = orbitConfigs[i];
                    const angle = elapsedTime * cfg.speed + cfg.phase;
                    targetPoints[i].set(
                        Math.cos(angle) * cfg.rx,
                        Math.sin(angle) * cfg.ry,
                        0
                    ).applyMatrix4(cfg.group.matrix);
                }

                const cfg0 = orbitConfigs[0];
                const angle4 = elapsedTime * (cfg0.speed * 0.9) + cfg0.phase + Math.PI * 0.85;
                targetPoints[3].set(
                    Math.cos(angle4) * cfg0.rx,
                    Math.sin(angle4) * cfg0.ry,
                    0
                ).applyMatrix4(cfg0.group.matrix);

                for (let i = 0; i < OUTER_COUNT; i++) {
                    const n = outerNodes[i];
                    const currentTheta = n.baseTheta + elapsedTime * n.speedTheta + Math.sin(elapsedTime * 0.4 + n.phase) * 0.35;
                    const currentPhi = n.basePhi + elapsedTime * n.speedPhi + Math.cos(elapsedTime * 0.35 + n.phase) * 0.35;
                    const currentRadius = (n.baseRadius + Math.sin(elapsedTime * n.radialFreq + n.phase) * n.radialAmp) * introNodeRadiusFactor;

                    n.pos.set(
                        currentRadius * Math.sin(currentPhi) * Math.cos(currentTheta),
                        currentRadius * Math.sin(currentPhi) * Math.sin(currentTheta),
                        currentRadius * Math.cos(currentPhi)
                    );

                    let mouseEnergy = 0;
                    if (isMouseInside && seqState === 'NORMAL') {
                        tempVec.copy(n.pos).sub(localMousePos);
                        const distToMouse = tempVec.length();
                        const influenceRadius = 1.75;
                        if (distToMouse < influenceRadius && distToMouse > 0.001) {
                            const force = Math.pow(1.0 - distToMouse / influenceRadius, 1.8);
                            n.pos.addScaledVector(tempVec.normalize(), force * 0.45);
                            mouseEnergy = force * 1.4;
                        }
                    }

                    n.energy = mouseEnergy;

                    outerPositions[i * 3] = n.pos.x;
                    outerPositions[i * 3 + 1] = n.pos.y;
                    outerPositions[i * 3 + 2] = n.pos.z;
                    outerEnergies[i] = n.energy;
                }

                outerGeo.attributes.position.needsUpdate = true;
                outerGeo.attributes.aEnergy.needsUpdate = true;

                let vertexIndex = 0;
                const pushLine = (pA, pB, cA, cB) => {
                    if (vertexIndex + 2 >= MAX_LINES * 2) return;
                    linePositions[vertexIndex * 3] = pA.x;
                    linePositions[vertexIndex * 3 + 1] = pA.y;
                    linePositions[vertexIndex * 3 + 2] = pA.z;
                    lineColors[vertexIndex * 3] = cA;
                    lineColors[vertexIndex * 3 + 1] = cA;
                    lineColors[vertexIndex * 3 + 2] = cA;
                    vertexIndex++;

                    linePositions[vertexIndex * 3] = pB.x;
                    linePositions[vertexIndex * 3 + 1] = pB.y;
                    linePositions[vertexIndex * 3 + 2] = pB.z;
                    lineColors[vertexIndex * 3] = cB;
                    lineColors[vertexIndex * 3 + 1] = cB;
                    lineColors[vertexIndex * 3 + 2] = cB;
                    vertexIndex++;
                };

                const maxOuterDist = 1.28;
                const maxSpikeDist = 1.38;

                for (let i = 0; i < OUTER_COUNT; i++) {
                    const nA = outerNodes[i];

                    for (let j = i + 1; j < OUTER_COUNT; j++) {
                        const nB = outerNodes[j];
                        const dist = nA.pos.distanceTo(nB.pos);
                        if (dist < maxOuterDist) {
                            const base = Math.pow(1.0 - dist / maxOuterDist, 1.5) * 0.5;
                            const intA = Math.min(1.0, base + nA.energy * 0.3);
                            const intB = Math.min(1.0, base + nB.energy * 0.3);
                            pushLine(nA.pos, nB.pos, intA, intB);
                        }
                    }

                    for (let k = 0; k < 4; k++) {
                        const spikePos = targetPoints[k];
                        const distToSpike = nA.pos.distanceTo(spikePos);
                        if (distToSpike < maxSpikeDist) {
                            const intensity = Math.min(1.0, Math.pow(1.0 - distToSpike / maxSpikeDist, 1.4) * 0.72);
                            tempVec.copy(spikePos).multiplyScalar(0.95);
                            pushLine(nA.pos, tempVec, intensity, intensity * 1.1);
                        }
                    }

                    const distToCenter = nA.pos.length();
                    if (distToCenter < 1.9) {
                        const intensity = Math.min(1.0, Math.pow(1.0 - Math.max(0, distToCenter - 1.25) / 0.65, 1.6) * 0.45);
                        tempVec.copy(nA.pos).normalize().multiplyScalar(1.22);
                        pushLine(nA.pos, tempVec, intensity, intensity * 0.35);
                    }
                }

                linesGeo.setDrawRange(0, vertexIndex);
                linesGeo.attributes.position.needsUpdate = true;
                linesGeo.attributes.color.needsUpdate = true;

                coreShellMat.uniforms.uLocalMouse.value.copy(localMousePos);
                coreShellMat.uniforms.uMouseActive.value = (isMouseInside && seqState === 'NORMAL') ? 1.0 : 0.0;
            }

            postPass.uniforms.uBgColor.value.copy(currentBgVec);
            postPass.uniforms.uTime.value = elapsedTime;
            postPass.uniforms.uAnaglyph.value = currentAnaglyph;
            postPass.uniforms.uFlashWhite.value = currentFlashWhite;

            composer.render();
        }

        // 11. 창 크기 조절 대응
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const dpr = Math.min(window.devicePixelRatio, 2);

            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            renderer.setSize(width, height);
            renderer.setPixelRatio(dpr);
            coreShellMat.uniforms.uPixelRatio.value = dpr;
            historyLineMat.uniforms.uPixelRatio.value = dpr;

            updateHistoryLayout();

            composer.setSize(width, height);
            postPass.uniforms.uResolution.value.set(width, height);
        });

        animate();
    </script>
</body>
</html>
